<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>My Njangi — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>
    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import { session } from '/src/js/auth/session.js';
      import {
        resolveGroupContext,
        setStoredGroupId,
        getContributionStats,
        listMembers,
        getMyContributions,
        getSocialFundBalance,
        initiateContributionPayment,
        groupLabel
      } from '/src/js/api/njangi.js';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      renderShell({ role: 'member', title: 'My Njangi' });

      const renderPage = async () => {
        mountContent(`<div class="glass-card p-6">Loading Njangi status…</div>`);

        try {
          const { groups, activeGroupId, activeGroup } = await resolveGroupContext();
          if (!activeGroupId) {
            mountContent(`
              <div class="glass-card p-6">
                <p class="font-semibold">No group selected</p>
                <p class="mt-2 text-sm muted">Please be invited or added to a group first.</p>
              </div>
            `);
            return;
          }

          const currentUser = session.user() || {};

          const [statsResponse, members, myContributions, socialFundResponse] = await Promise.all([
            getContributionStats(activeGroupId),
            listMembers(activeGroupId),
            getMyContributions(activeGroupId),
            getSocialFundBalance(activeGroupId)
          ]);

          const stats = statsResponse.data || statsResponse;
          const socialFundBalance = socialFundResponse.balance || 0;

          const myMembership = members.find(m => 
            m.user_id === currentUser.id || 
            m.users?.id === currentUser.id ||
            m.users?.email === currentUser.email
          );

          const myPos = myMembership?.rotation_position || null;
          let turnText = '—';
          let turnSubtext = 'Not in rotation';

          if (myPos !== null && stats.cycleNumber) {
            if (myPos === stats.cycleNumber) {
              turnText = `Position ${myPos}`;
              turnSubtext = 'Active Turn (Payout Cycle)';
            } else if (myPos < stats.cycleNumber) {
              turnText = `Position ${myPos}`;
              turnSubtext = 'Turn passed / Payout received';
            } else {
              turnText = `Position ${myPos}`;
              const cyclesRemaining = myPos - stats.cycleNumber;
              const dateEst = new Date();
              if (activeGroup?.frequency === 'weekly') {
                dateEst.setDate(dateEst.getDate() + (cyclesRemaining * 7));
              } else {
                dateEst.setMonth(dateEst.getMonth() + cyclesRemaining);
              }
              turnSubtext = `Estimated: ${dateEst.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
            }
          }

          const hasPaidCurrentCycle = myContributions.some(c => 
            c.cycle_id === stats.cycleId && c.status === 'confirmed'
          );

          let nextDueAmount = activeGroup?.contribution_amount || 0;
          let dueTitle = 'Next due';
          let dueSub = `Cycle ${stats.cycleNumber || '—'} · MTN/Orange MoMo auto-debit`;
          let showPayButton = true;

          if (hasPaidCurrentCycle) {
            nextDueAmount = 0;
            dueTitle = 'Cycle Contribution';
            dueSub = `Cycle ${stats.cycleNumber || '—'} contribution paid. Thank you!`;
            showPayButton = false;
          }

          const recentList = myContributions.slice(0, 5).map(c => {
            const dateStr = new Date(c.created_at).toLocaleDateString();
            const cycleText = c.cycles?.cycle_number ? `Cycle ${c.cycles.cycle_number}` : 'Contribution';
            const chipClass = c.status === 'confirmed' ? 'paid' : c.status === 'failed' ? 'failed' : 'due';
            return `
              <li class="flex items-center justify-between py-3">
                <div>
                  <p class="text-sm font-medium">${escapeHtml(cycleText)}</p>
                  <p class="text-xs muted">${escapeHtml(c.payment_method || 'pending')} · ${Number(c.amount).toLocaleString()} FCFA</p>
                </div>
                <span class="chip chip-${chipClass}">${escapeHtml(c.status)}</span>
              </li>
            `;
          }).join('') || `<li class="py-6 text-center muted text-sm">No recent contributions found.</li>`;

          const groupOptions = groups.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === activeGroupId ? 'selected' : ''}>${escapeHtml(groupLabel(group))}</option>`).join('');

          mountContent(`
            <div class="glass-card p-5 mb-6 flex flex-wrap items-center gap-3">
              <select id="group-picker" class="glass-input w-auto">${groupOptions}</select>
            </div>

            <div class="grid gap-4 md:grid-cols-3 animate-fade-up">
              <div class="glass-card p-5 md:col-span-2">
                <p class="text-xs uppercase tracking-widest muted">${escapeHtml(dueTitle)}</p>
                <p class="mt-2 font-display text-3xl font-bold">${nextDueAmount.toLocaleString()} FCFA</p>
                <p class="mt-1 text-sm muted">${escapeHtml(dueSub)}</p>
                
                ${showPayButton ? `
                  <div class="mt-4 flex gap-2">
                    <button id="btn-pay-trigger" class="btn-primary">Pay now</button>
                    <a href="/app/member/history.html" class="btn-ghost">Review details</a>
                  </div>
                ` : `
                  <div class="mt-4">
                    <a href="/app/member/history.html" class="btn-ghost">View my history</a>
                  </div>
                `}

                <!-- Inline Payment Box -->
                <div id="payment-box" class="mt-4 hidden space-y-4 p-5 glass-card border border-[var(--border-subtle)]">
                  <div>
                    <h4 class="font-display font-bold text-sm">Make Cycle Contribution</h4>
                    <p class="text-xs muted">Initiate a mobile money payment for ${nextDueAmount.toLocaleString()} FCFA.</p>
                  </div>
                  <div class="space-y-3">
                    <div>
                      <label class="text-xs font-semibold uppercase tracking-wider muted">Select Gateway</label>
                      <select id="payment-gateway" class="glass-input mt-1">
                        <option value="momo_mtn">MTN MoMo</option>
                        <option value="momo_orange">Orange Money</option>
                        <option value="campay">Campay</option>
                      </select>
                    </div>
                    <div class="flex gap-2 justify-end">
                      <button type="button" id="btn-pay-cancel" class="btn-ghost">Cancel</button>
                      <button type="button" id="btn-pay-confirm" class="btn-primary">Confirm & Pay</button>
                    </div>
                    <p id="payment-message" class="text-xs text-amber-500"></p>
                  </div>
                </div>
              </div>

              <div class="glass-card p-5">
                <p class="text-xs uppercase tracking-widest muted">My payout turn</p>
                <p class="mt-2 font-display text-2xl font-bold">${escapeHtml(turnText)}</p>
                <p class="mt-1 text-xs muted">${escapeHtml(turnSubtext)}</p>
              </div>
            </div>

            <div class="mt-6 grid gap-4 lg:grid-cols-2">
              <div class="glass-card p-5">
                <h2 class="font-display text-xl font-bold mb-3">Recent contributions</h2>
                <ul class="divide-y divide-[var(--border-subtle)]">
                  ${recentList}
                </ul>
              </div>

              <div class="glass-card p-5">
                <h2 class="font-display text-xl font-bold mb-3">Group ledger</h2>
                <div class="grid grid-cols-2 gap-3 text-sm">
                  <div class="glass-card p-3">
                    <p class="muted text-xs">Pot balance</p>
                    <p class="font-display text-lg font-bold">${Number(stats.totalCollected || 0).toLocaleString()} FCFA</p>
                  </div>
                  <div class="glass-card p-3">
                    <p class="muted text-xs">Members paid</p>
                    <p class="font-display text-lg font-bold">${stats.confirmed || 0} / ${stats.totalMembers || 0}</p>
                  </div>
                  <div class="glass-card p-3">
                    <p class="muted text-xs">Social fund</p>
                    <p class="font-display text-lg font-bold">${socialFundBalance.toLocaleString()} FCFA</p>
                  </div>
                  <div class="glass-card p-3">
                    <p class="muted text-xs">Current Cycle</p>
                    <p class="font-display text-lg font-bold">${stats.cycleNumber || '—'} of ${stats.totalMembers || '—'}</p>
                  </div>
                </div>
                <a href="/app/member/rotation.html" class="mt-4 inline-block text-sm accent-text font-semibold">View full rotation →</a>
              </div>
            </div>
          `);

          // Event listeners
          document.querySelector('#group-picker').addEventListener('change', (event) => {
            setStoredGroupId(event.target.value);
            renderPage();
          });

          const payTrigger = document.querySelector('#btn-pay-trigger');
          if (payTrigger) {
            const paymentBox = document.querySelector('#payment-box');
            const payCancel = document.querySelector('#btn-pay-cancel');
            const payConfirm = document.querySelector('#btn-pay-confirm');
            const payMsg = document.querySelector('#payment-message');

            payTrigger.addEventListener('click', () => {
              paymentBox.classList.remove('hidden');
              payMsg.textContent = '';
            });

            payCancel.addEventListener('click', () => {
              paymentBox.classList.add('hidden');
              payMsg.textContent = '';
            });

            payConfirm.addEventListener('click', async () => {
              payConfirm.disabled = true;
              if (payCancel) payCancel.disabled = true;
              payMsg.textContent = 'Initiating transaction...';
              const gateway = document.querySelector('#payment-gateway').value;

              try {
                await initiateContributionPayment(activeGroupId, gateway);
                payMsg.textContent = 'Payment initiated! Check your phone for the PIN prompt.';
                
                let attempts = 0;
                const maxAttempts = 10;
                
                const checkPaymentStatus = async () => {
                  attempts++;
                  try {
                    const contributions = await getMyContributions(activeGroupId);
                    const confirmedPayment = contributions.some(c => 
                      c.cycle_id === stats.cycleId && c.status === 'confirmed'
                    );

                    if (confirmedPayment) {
                      payMsg.innerHTML = '<span class="text-emerald-500 font-bold">✓ Payment Confirmed! Contribution received.</span>';
                      setTimeout(() => {
                        renderPage();
                      }, 2000);
                    } else if (attempts >= maxAttempts) {
                      payMsg.textContent = 'Transaction is still processing on the network. Check back in a few minutes.';
                      payConfirm.disabled = false;
                      if (payCancel) payCancel.disabled = false;
                      setTimeout(() => {
                        renderPage();
                      }, 3000);
                    } else {
                      payMsg.textContent = `Awaiting PIN confirmation... (Checking status: ${attempts}/${maxAttempts})`;
                      setTimeout(checkPaymentStatus, 3000);
                    }
                  } catch (err) {
                    if (attempts >= maxAttempts) {
                      payMsg.textContent = 'Verification timed out. Please refresh page manually.';
                      payConfirm.disabled = false;
                      if (payCancel) payCancel.disabled = false;
                    } else {
                      setTimeout(checkPaymentStatus, 3000);
                    }
                  }
                };

                // Start polling after a short initial delay of 3 seconds
                setTimeout(checkPaymentStatus, 3000);

              } catch (error) {
                payConfirm.disabled = false;
                if (payCancel) payCancel.disabled = false;
                payMsg.textContent = error.message || 'Payment initiation failed.';
              }
            });
          }

        } catch (error) {
          mountContent(`<div class="glass-card p-6"><p class="text-sm text-red-500">${escapeHtml(error.message || 'Failed to load member overview.')}</p></div>`);
        }
      };

      renderPage();
    </script>
  </body>
</html>
