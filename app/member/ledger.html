<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Group ledger — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>
    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import {
        resolveGroupContext,
        setStoredGroupId,
        getGroupLedger,
        getGroupSummary,
        getSocialFundBalance,
        groupLabel
      } from '/src/js/api/njangi.js';
      import { session } from '/src/js/auth/session.js';

      const apiBase = import.meta.env.VITE_API_BASE_URL || '';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      renderShell({ role: 'member', title: 'Group ledger' });

      let allLedgerItems = [];
      let activeCycleFilter = 'all';
      let activeGroupId = '';

      const renderTable = () => {
        const filtered = activeCycleFilter === 'all'
          ? allLedgerItems
          : allLedgerItems.filter(item => item.cycleNumber === Number(activeCycleFilter));

        const tbody = document.querySelector('#ledger-tbody');
        if (!tbody) return;

        tbody.innerHTML = filtered.length
          ? filtered.map(item => {
              const dateStr = item.date ? new Date(item.date).toLocaleDateString() : '—';
              
              let receiptBtn = '<span class="muted text-xs">—</span>';
              if (item.id) {
                if (item.type === 'contribution' && item.status === 'paid') {
                  receiptBtn = `<a href="${apiBase}/groups/${activeGroupId}/contributions/${item.id}/receipt?token=${encodeURIComponent(session.token() || '')}" target="_blank" class="nav-link text-xs inline-flex justify-center">↓ Receipt</a>`;
                } else if (item.type === 'payout') {
                  receiptBtn = `<a href="${apiBase}/groups/${activeGroupId}/payouts/${item.id}/receipt?token=${encodeURIComponent(session.token() || '')}" target="_blank" class="nav-link text-xs inline-flex justify-center">↓ Receipt</a>`;
                }
              }

              return `
                <tr>
                  <td class="px-5 py-3">${escapeHtml(dateStr)}</td>
                  <td class="capitalize">${escapeHtml(item.type)}</td>
                  <td class="font-medium">${escapeHtml(item.member)}</td>
                  <td>${escapeHtml(item.method)}</td>
                  <td class="font-mono">${escapeHtml(item.amount)}</td>
                  <td><span class="chip chip-${item.status}">${escapeHtml(item.statusLabel)}</span></td>
                  <td class="text-right pr-5">${receiptBtn}</td>
                </tr>
              `;
            }).join('')
          : `
            <tr>
              <td colspan="7" class="px-5 py-8 text-center muted">No activities found in this cycle.</td>
            </tr>
          `;
      };

      const renderPage = async () => {
        mountContent(`<div class="glass-card p-6">Loading ledger…</div>`);

        try {
          const context = await resolveGroupContext();
          activeGroupId = context.activeGroupId;
          const activeGroup = context.activeGroup;
          const groups = context.groups;

          if (!activeGroupId) {
            mountContent(`
              <div class="glass-card p-6">
                <p class="font-semibold">No group selected</p>
                <p class="mt-2 text-sm muted">Choose a group first to view the ledger.</p>
              </div>
            `);
            return;
          }

          const [ledgerResponse, summaryResponse, socialFundResponse] = await Promise.all([
            getGroupLedger(activeGroupId),
            getGroupSummary(activeGroupId),
            getSocialFundBalance(activeGroupId)
          ]);

          const socialFundBalance = Number(socialFundResponse?.balance ?? socialFundResponse?.data?.balance ?? 0);

          const ledgerData = ledgerResponse?.data ?? ledgerResponse ?? {};
          const summary = summaryResponse?.data ?? summaryResponse ?? {};

          // Flatten cycles into list of activities
          allLedgerItems = [];
          const cyclesList = Array.isArray(ledgerData.cycles) ? ledgerData.cycles : [];
          
          cyclesList.forEach(c => {
            if (c.payout) {
              allLedgerItems.push({
                id: c.payout.id,
                date: c.payout.date || '',
                type: 'payout',
                member: c.payout.recipientName,
                method: 'Mobile Money',
                amount: `− ${Number(c.payout.amount).toLocaleString()} FCFA`,
                status: 'info',
                statusLabel: 'Sent',
                cycleNumber: c.cycleNumber
              });
            }

            const contributions = c.contributions || [];
            contributions.forEach(contrib => {
              const chipClass = contrib.status === 'confirmed' ? 'paid' : contrib.status === 'failed' ? 'failed' : 'due';
              allLedgerItems.push({
                id: contrib.id,
                date: contrib.date || '',
                type: `contribution`,
                member: contrib.memberName,
                method: 'Mobile Money/Cash',
                amount: `+ ${Number(contrib.amount).toLocaleString()} FCFA`,
                status: chipClass,
                statusLabel: contrib.status === 'confirmed' ? 'Paid' : contrib.status,
                cycleNumber: c.cycleNumber
              });
            });
          });

          // Sort by date descending
          allLedgerItems.sort((a, b) => new Date(b.date) - new Date(a.date));

          const groupOptions = groups.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === activeGroupId ? 'selected' : ''}>${escapeHtml(groupLabel(group))}</option>`).join('');

          // Cycle filter options
          const cycleNumbers = [...new Set(cyclesList.map(c => c.cycleNumber))].sort((a, b) => b - a);
          const cyclePickerOptions = cycleNumbers.map(num => `<option value="${num}">Cycle ${num}</option>`).join('');

          mountContent(`
            <div class="glass-card p-5 mb-6 flex flex-wrap items-center gap-3">
              <select id="group-picker" class="glass-input w-auto">${groupOptions}</select>
              <div class="flex-1"></div>
              <div class="flex items-center gap-3">
                <span class="chip chip-info">Immutable</span>
                <p class="text-xs muted">Permanent logs. Corrections added as new entries.</p>
              </div>
            </div>

            <div class="glass-card p-5 mb-6 flex items-center justify-between flex-wrap gap-3">
              <div>
                <p class="text-xs uppercase tracking-widest muted">Cycle range</p>
                <h3 class="font-display text-lg font-bold">Filter Ledger Logs</h3>
              </div>
              <select id="cycle-picker" class="glass-input w-auto">
                <option value="all">All cycles</option>
                ${cyclePickerOptions}
              </select>
            </div>

            <div class="grid gap-4 md:grid-cols-4 mb-6">
              <div class="glass-card p-5">
                <p class="text-xs muted uppercase">Active Pot</p>
                <p class="mt-1 font-display text-2xl font-bold">${Number(summary.balance || 0).toLocaleString()} FCFA</p>
              </div>
              <div class="glass-card p-5">
                <p class="text-xs muted uppercase">Total Collected</p>
                <p class="mt-1 font-display text-2xl font-bold">${Number(summary.totalContributed || 0).toLocaleString()} FCFA</p>
              </div>
              <div class="glass-card p-5">
                <p class="text-xs muted uppercase">Total Paid Out</p>
                <p class="mt-1 font-display text-2xl font-bold">${Number(summary.totalPaidOut || 0).toLocaleString()} FCFA</p>
              </div>
              <div class="glass-card p-5">
                <p class="text-xs muted uppercase">Social Fund</p>
                <p class="mt-1 font-display text-2xl font-bold">${socialFundBalance.toLocaleString()} FCFA</p>
              </div>
            </div>

            <div class="glass-card p-0 overflow-hidden">
              <table class="w-full text-sm">
                <thead class="text-left muted uppercase text-xs bg-[var(--bg-muted)]">
                  <tr>
                    <th class="px-5 py-3">Date</th>
                    <th>Type</th>
                    <th>Member</th>
                    <th>Method</th>
                    <th>Amount (FCFA)</th>
                    <th>Status</th>
                    <th class="text-right pr-5">Receipt</th>
                  </tr>
                </thead>
                <tbody id="ledger-tbody" class="divide-y divide-[var(--border-subtle)]"></tbody>
              </table>
            </div>

            <p class="mt-4 text-xs muted">PR-31 full group ledger · PR-32 payout history · PR-34 immutable.</p>
          `);

          renderTable();

          document.querySelector('#group-picker').addEventListener('change', (event) => {
            setStoredGroupId(event.target.value);
            renderPage();
          });

          document.querySelector('#cycle-picker').addEventListener('change', (event) => {
            activeCycleFilter = event.target.value;
            renderTable();
          });

        } catch (error) {
          mountContent(`<div class="glass-card p-6"><p class="text-sm text-red-500">${escapeHtml(error.message || 'Failed to load group ledger.')}</p></div>`);
        }
      };

      renderPage();
    </script>
  </body>
</html>
