<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Platform Admin — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>

    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import { fetchAdminStats, fetchAdminGroups } from '/src/js/api/admin.js';

      renderShell({ role: 'admin', title: 'Platform overview' });

      const renderPage = async () => {
        mountContent(`
          <div class="glass-card p-6">Loading platform data...</div>
        `);

        try {
          const stats = await fetchAdminStats();
          const groups = await fetchAdminGroups();

          const mrrFormatted = Number(stats.mrr || 0).toLocaleString();
          const volumeFormatted = Number(stats.totalVolume || 0).toLocaleString();

          // Render rows
          const rows = groups.length
            ? groups.map(g => {
                const groupMRR = g.subscription_status === 'active'
                  ? (g.subscription_tier === 'growth' ? 5000 : (g.subscription_tier === 'enterprise' ? 15000 : 0))
                  : 0;
                
                const chipClass = g.subscription_status === 'active' 
                  ? 'paid' 
                  : (g.subscription_status === 'past_due' ? 'due' : 'info');

                return `
                  <tr>
                    <td class="py-3 font-medium">${g.name}</td>
                    <td>${g.memberCount}</td>
                    <td><span class="chip chip-${chipClass} uppercase text-[10px] font-bold">${g.subscription_tier} / ${g.subscription_status}</span></td>
                    <td>${groupMRR.toLocaleString()} FCFA</td>
                  </tr>
                `;
              }).join('')
            : `
              <tr>
                <td colspan="4" class="py-8 text-center muted">No active groups in the platform.</td>
              </tr>
            `;

          mountContent(`
            <div class="grid gap-6 md:grid-cols-4">
              <div class="glass-card p-5 animate-fade-up">
                <p class="text-xs muted uppercase tracking-wider">Active groups</p>
                <p class="mt-2 font-display text-3xl font-bold">${stats.totalGroups}</p>
                <p class="mt-1 text-xs text-emerald-500">Live count</p>
              </div>
              <div class="glass-card p-5 animate-fade-up" style="animation-delay: 100ms">
                <p class="text-xs muted uppercase tracking-wider">Total members</p>
                <p class="mt-2 font-display text-3xl font-bold">${stats.totalUsers}</p>
                <p class="mt-1 text-xs muted">Registered accounts</p>
              </div>
              <div class="glass-card p-5 animate-fade-up" style="animation-delay: 200ms">
                <p class="text-xs muted uppercase tracking-wider">MoMo volume (FCFA)</p>
                <p class="mt-2 font-display text-3xl font-bold">${volumeFormatted}</p>
                <p class="mt-1 text-xs text-emerald-500">Total flows</p>
              </div>
              <div class="glass-card p-5 animate-fade-up" style="animation-delay: 300ms">
                <p class="text-xs muted uppercase tracking-wider">MRR (FCFA)</p>
                <p class="mt-2 font-display text-3xl font-bold text-[var(--accent)]">${mrrFormatted}</p>
                <p class="mt-1 text-xs text-emerald-500">Monthly subscription revenue</p>
              </div>
            </div>

            <div class="glass-card mt-6 p-6 animate-fade-up" style="animation-delay: 400ms">
              <div class="flex items-center justify-between mb-4">
                <h2 class="font-display text-xl font-bold">Subscribed Njangi groups</h2>
                <a href="/app/admin/groups.html" class="btn-primary text-xs">Manage Groups</a>
              </div>
              <table class="w-full text-sm">
                <thead class="text-left muted uppercase text-xs">
                  <tr>
                    <th class="py-2">Group</th><th>Members</th><th>Status</th><th>MRR</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border-subtle)]">
                  ${rows}
                </tbody>
              </table>
            </div>
          `);
        } catch (error) {
          mountContent(`
            <div class="glass-card p-6">
              <p class="text-red-500">Error loading dashboard: ${error.message || error}</p>
            </div>
          `);
        }
      };

      renderPage();
    </script>
  </body>
</html>
