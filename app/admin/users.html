<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Users — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <!-- Define usersPage BEFORE boot.js calls Alpine.start() -->
    <script type="module">
      import { fetchAdminUsers, updateUserRole, deleteUser } from '/src/js/api/admin.js';

      window.usersPage = () => ({
        users: [],
        search: '',
        loading: false,
        error: '',
        success: '',
        
        // Modal states
        targetUser: null,
        newRoleAdmin: false,
        deleteError: '',

        async init() {
          await this.loadUsers();
        },

        async loadUsers() {
          this.loading = true;
          this.error = '';
          try {
            this.users = await fetchAdminUsers();
          } catch (err) {
            this.error = err.message || 'Failed to load users';
          } finally {
            this.loading = false;
          }
        },

        get filteredUsers() {
          const q = this.search.toLowerCase().trim();
          if (!q) return this.users;
          return this.users.filter(u => {
            const name = (u.full_name || '').toLowerCase();
            const email = (u.email || '').toLowerCase();
            const phone = (u.phone || '').toLowerCase();
            return name.includes(q) || email.includes(q) || phone.includes(q);
          });
        },

        formatDate(dateStr) {
          if (!dateStr) return 'N/A';
          try {
            return new Date(dateStr).toLocaleDateString(undefined, {
              year: 'numeric',
              month: 'short',
              day: 'numeric'
            });
          } catch (e) {
            return dateStr;
          }
        },

        getInitials(name) {
          if (!name) return 'U';
          return name
            .split(' ')
            .map(n => n[0])
            .slice(0, 2)
            .join('')
            .toUpperCase();
        },

        openRoleModal(user) {
          this.targetUser = user;
          this.newRoleAdmin = !user.is_admin;
          this.error = '';
          this.success = '';
          const modal = document.getElementById('role-modal');
          if (modal) modal.showModal();
        },

        async confirmRoleChange() {
          if (!this.targetUser) return;
          this.loading = true;
          this.error = '';
          try {
            const updated = await updateUserRole(this.targetUser.id, this.newRoleAdmin);
            // Locate user in local array and update
            const index = this.users.findIndex(u => u.id === this.targetUser.id);
            if (index !== -1) {
              this.users[index] = { ...this.users[index], is_admin: updated.is_admin };
            }
            const modal = document.getElementById('role-modal');
            if (modal) modal.close();
            this.targetUser = null;
          } catch (err) {
            this.error = err.message || 'Failed to update user role';
          } finally {
            this.loading = false;
          }
        },

        openDeleteModal(user) {
          this.targetUser = user;
          this.deleteError = '';
          this.error = '';
          this.success = '';
          const modal = document.getElementById('delete-modal');
          if (modal) modal.showModal();
        },

        async confirmDelete() {
          if (!this.targetUser) return;
          this.loading = true;
          this.deleteError = '';
          try {
            await deleteUser(this.targetUser.id);
            this.users = this.users.filter(u => u.id !== this.targetUser.id);
            const modal = document.getElementById('delete-modal');
            if (modal) modal.close();
            this.targetUser = null;
          } catch (err) {
            this.deleteError = err.message || 'Failed to delete user';
          } finally {
            this.loading = false;
          }
        }
      });
    </script>
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>

    <!-- UI structure to be mounted in shell -->
    <template id="users-template">
      <div x-data="usersPage()" class="space-y-6">
        
        <!-- Top bar / Info alerts -->
        <template x-if="error">
          <div class="glass-card border-red-500/30 bg-red-500/10 p-4 rounded-xl flex items-center gap-3 text-red-400">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span class="text-sm font-medium" x-text="error"></span>
          </div>
        </template>

        <template x-if="success">
          <div class="glass-card border-green-500/30 bg-green-500/10 p-4 rounded-xl flex items-center gap-3 text-green-400">
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-sm font-medium" x-text="success"></span>
          </div>
        </template>

        <!-- Search and Action header -->
        <div class="glass-card p-5 flex flex-wrap items-center gap-4 justify-between">
          <div class="flex-1 min-w-[280px] relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none muted">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </span>
            <input 
              type="search" 
              x-model="search" 
              placeholder="Search users by name, email, or phone..." 
              class="glass-input pl-10 w-full"
            />
          </div>
          <div class="flex items-center gap-3">
            <button @click="loadUsers()" class="btn-ghost border border-subtle flex items-center gap-2" :disabled="loading">
              <svg class="h-4 w-4" :class="loading ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 3v5h-5" />
              </svg>
              <span>Refresh</span>
            </button>
            <div class="text-xs muted font-semibold uppercase tracking-wider">
              Total: <span class="font-mono text-sm text-[var(--text-primary)]" x-text="users.length"></span>
            </div>
          </div>
        </div>

        <!-- User list container -->
        <div class="glass-card p-0 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-left muted uppercase text-xs bg-[var(--bg-muted)] border-b border-subtle select-none">
                <tr>
                  <th class="px-5 py-4 font-semibold">User</th>
                  <th class="px-5 py-4 font-semibold">Contact</th>
                  <th class="px-5 py-4 font-semibold">Role</th>
                  <th class="px-5 py-4 font-semibold">Njangi Memberships</th>
                  <th class="px-5 py-4 font-semibold">Joined Date</th>
                  <th class="px-5 py-4 font-semibold text-right pr-5">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--border-subtle)]">
                <!-- Empty state -->
                <template x-if="filteredUsers.length === 0">
                  <tr>
                    <td colspan="6" class="px-5 py-12 text-center muted">
                      <div class="flex flex-col items-center justify-center gap-2">
                        <svg class="h-8 w-8 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <p class="font-medium text-sm">No platform users found.</p>
                      </div>
                    </td>
                  </tr>
                </template>

                <!-- Users Rows -->
                <template x-for="user in filteredUsers" :key="user.id">
                  <tr class="hover:bg-[var(--bg-muted)]/30 transition-colors">
                    
                    <!-- User info -->
                    <td class="px-5 py-4">
                      <div class="flex items-center gap-3">
                        <div class="h-9 w-9 rounded-full accent-bg text-white grid place-items-center font-semibold text-sm select-none" x-text="getInitials(user.full_name)"></div>
                        <div>
                          <p class="font-medium text-[var(--text-primary)]" x-text="user.full_name"></p>
                          <span class="text-xs font-mono muted" x-text="user.id.substring(0,8) + '...'"></span>
                        </div>
                      </div>
                    </td>

                    <!-- Contact -->
                    <td class="px-5 py-4">
                      <div class="flex flex-col gap-0.5">
                        <p class="font-medium" x-text="user.email"></p>
                        <p class="text-xs font-mono muted" x-text="user.phone || 'No phone'"></p>
                      </div>
                    </td>

                    <!-- Global role -->
                    <td class="px-5 py-4 select-none">
                      <template x-if="user.is_admin">
                        <span class="chip chip-paid uppercase text-[10px] font-bold">Platform Admin</span>
                      </template>
                      <template x-if="!user.is_admin">
                        <span class="chip chip-info uppercase text-[10px] font-bold">Member</span>
                      </template>
                    </td>

                    <!-- Njangi spaces role -->
                    <td class="px-5 py-4">
                      <div class="flex flex-wrap gap-1 max-w-[280px]">
                        <template x-if="!user.memberships || user.memberships.length === 0">
                          <span class="text-xs muted italic">No active memberships</span>
                        </template>
                        <template x-for="m in user.memberships">
                          <span class="chip chip-badge flex items-center gap-1 text-[11px] border border-subtle py-0.5 px-2 rounded-full" style="background: rgba(255, 255, 255, 0.03);">
                            <span class="font-medium text-[var(--text-primary)]" x-text="m.groupName"></span>
                            <span class="muted text-[10px]" x-text="'(' + m.role + ')'"></span>
                          </span>
                        </template>
                      </div>
                    </td>

                    <!-- Joined date -->
                    <td class="px-5 py-4 text-xs font-mono muted" x-text="formatDate(user.created_at)"></td>

                    <!-- Actions -->
                    <td class="px-5 py-4 text-right pr-5 select-none">
                      <div class="flex items-center justify-end gap-2">
                        <button 
                          @click="openRoleModal(user)" 
                          class="btn-ghost border border-subtle py-1.5 px-2.5 rounded-lg text-xs font-semibold hover:bg-[var(--bg-muted)] transition-all"
                          x-text="user.is_admin ? 'Demote' : 'Promote'"
                        ></button>
                        <button 
                          @click="openDeleteModal(user)" 
                          class="btn-ghost border border-subtle py-1.5 px-2.5 rounded-lg text-xs font-semibold text-red-400 border-red-500/20 hover:bg-red-500/10 hover:border-red-500/40 transition-all"
                        >Delete</button>
                      </div>
                    </td>

                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Role confirmation modal inside loop context -->
        <dialog id="role-modal" class="glass-card-heavy p-6 max-w-md w-full border border-subtle rounded-2xl backdrop:backdrop-blur-md" style="background: rgba(18, 18, 18, 0.95); color: #fff; margin: auto; border: 1px solid var(--border-subtle); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);">
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border-subtle)]">
            <h3 class="font-display font-bold text-lg">Change Global Role</h3>
            <button type="button" @click="document.getElementById('role-modal').close()" class="nav-link p-1" style="background: transparent; border: none; color: #999; cursor: pointer;">✕</button>
          </div>
          <div class="mt-4 space-y-4">
            <p class="text-sm muted">
              Are you sure you want to <span class="font-semibold text-white" x-text="newRoleAdmin ? 'promote' : 'demote'"></span> 
              <span class="font-semibold text-white" x-text="targetUser ? targetUser.full_name : ''"></span> 
              <span x-text="newRoleAdmin ? 'to a Platform Administrator' : 'to a standard Member role'"></span>?
            </p>
            
            <!-- Modal Error alert -->
            <template x-if="error">
              <div class="glass-card border-red-500/30 bg-red-500/10 p-3 rounded-lg text-xs text-red-400">
                <p x-text="error"></p>
              </div>
            </template>

            <div class="pt-2 flex gap-3">
              <button @click="confirmRoleChange()" class="btn-primary flex-1" :disabled="loading">
                <span x-text="loading ? 'Updating...' : 'Confirm Change'"></span>
              </button>
              <button type="button" @click="document.getElementById('role-modal').close()" class="btn-ghost border border-subtle flex-1" :disabled="loading">Cancel</button>
            </div>
          </div>
        </dialog>

        <!-- Delete user warning modal -->
        <dialog id="delete-modal" class="glass-card-heavy p-6 max-w-md w-full border border-subtle rounded-2xl backdrop:backdrop-blur-md" style="background: rgba(18, 18, 18, 0.95); color: #fff; margin: auto; border: 1px solid var(--border-subtle); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);">
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border-subtle)]">
            <h3 class="font-display font-bold text-lg text-red-400">Delete Account</h3>
            <button type="button" @click="document.getElementById('delete-modal').close()" class="nav-link p-1" style="background: transparent; border: none; color: #999; cursor: pointer;">✕</button>
          </div>
          <div class="mt-4 space-y-4">
            <div class="glass-card border-red-500/20 bg-red-500/5 p-4 rounded-xl text-xs text-red-400 space-y-2">
              <p class="font-semibold uppercase tracking-wider">Warning: Permanent Action</p>
              <p>Deleting <span class="font-bold text-white" x-text="targetUser ? targetUser.full_name : ''"></span> will completely purge their account, profile data, and any group histories on NjangiBridge. This operation cannot be undone.</p>
            </div>
            
            <!-- Modal Error alert -->
            <template x-if="deleteError">
              <div class="glass-card border-red-500/30 bg-red-500/10 p-3 rounded-lg text-xs text-red-400 space-y-1">
                <p class="font-semibold">Error Deleting User:</p>
                <p x-text="deleteError"></p>
              </div>
            </template>

            <div class="pt-2 flex gap-3">
              <button @click="confirmDelete()" class="btn-primary bg-red-600 hover:bg-red-700 text-white flex-1" :disabled="loading">
                <span x-text="loading ? 'Deleting...' : 'Delete Permanently'"></span>
              </button>
              <button type="button" @click="document.getElementById('delete-modal').close()" class="btn-ghost border border-subtle flex-1" :disabled="loading">Cancel</button>
            </div>
          </div>
        </dialog>

      </div>
    </template>

    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';

      renderShell({ role: 'admin', title: 'Global user management' });
      
      const template = document.getElementById('users-template').innerHTML;
      mountContent(template);
    </script>
  </body>
</html>
