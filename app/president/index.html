<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>President — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>
    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import { session } from '/src/js/auth/session.js';
      import {
        resolveGroupContext,
        setStoredGroupId,
        getContributionStats,
        listMembers,
        getCurrentPayout,
        determineNextRecipient,
        nominatePayout,
        approvePayout,
        listContributions,
        groupLabel
      } from '/src/js/api/njangi.js';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      renderShell({ role: 'president', title: 'Group overview' });

      const renderPage = async () => {
        mountContent(`<div class="glass-card p-6">Loading group overview…</div>`);

        try {
          const { groups, activeGroupId, activeGroup } = await resolveGroupContext();
          if (!activeGroupId) {
            mountContent(`
              <div class="glass-card p-6">
                <p class="font-semibold">No group selected</p>
                <p class="mt-2 text-sm muted">Choose or create a group first.</p>
              </div>
            `);
            return;
          }

          const currentUser = session.user() || {};

          // Fetch dashboard data
          const [statsResponse, members, currentPayoutResponse, contributionsResponse] = await Promise.all([
            getContributionStats(activeGroupId),
            listMembers(activeGroupId),
            getCurrentPayout(activeGroupId),
            listContributions(activeGroupId)
          ]);

          const stats = statsResponse.data || statsResponse;
          const currentPayoutData = currentPayoutResponse.data || currentPayoutResponse;
          const contributions = contributionsResponse.data || contributionsResponse;

          const currentPayout = currentPayoutData.payout || null;
          const eligibility = currentPayoutData.eligibility || { eligible: false, reason: 'No active cycle' };
          const activeCycleNumber = stats.cycleNumber || 1;

          // Personal status card details
          const myMembership = members.find(m => 
            m.user_id === currentUser.id || 
            m.users?.id === currentUser.id ||
            m.users?.email === currentUser.email
          );
          const myPos = myMembership?.rotation_position || '—';
          
          const hasPaidCurrent = contributions.some(c => 
            c.user_id === currentUser.id && c.cycle_id === stats.cycleId && c.status === 'confirmed'
          );
          const personalStatusText = hasPaidCurrent ? 'Paid' : 'Unpaid';

          // Group picker options
          const groupOptions = groups.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === activeGroupId ? 'selected' : ''}>${escapeHtml(groupLabel(group))}</option>`).join('');

          // Members list dropdown options for nomination
          const memberOptions = members.map((member) => {
            const id = member.users?.id || member.user_id;
            const name = member.users?.full_name || member.users?.email || 'Member';
            return `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`;
          }).join('') || '<option value="">No members available</option>';

          // Payout action card rendering
          let payoutCardHtml = '';
          const rotationType = activeGroup?.rotation_type || 'fixed';

          if (!currentPayout) {
            // Recipient needs to be determined
            if (rotationType === 'president') {
              payoutCardHtml = `
                <p class="text-xs uppercase tracking-widest muted">Next payout</p>
                <p class="mt-2 font-display text-lg font-bold">Needs Nomination</p>
                <p class="mt-1 text-xs muted">Mode: President Decides</p>
                
                <form id="nominate-form" class="mt-4 space-y-3">
                  <div>
                    <label class="text-[10px] uppercase tracking-wider muted font-semibold">Select Nominee</label>
                    <select name="recipientId" class="glass-input mt-1">${memberOptions}</select>
                  </div>
                  <div>
                    <label class="text-[10px] uppercase tracking-wider muted font-semibold">Gateway</label>
                    <select name="deliveryMethod" class="glass-input mt-1">
                      <option value="momo_mtn">MTN MoMo</option>
                      <option value="momo_orange">Orange Money</option>
                      <option value="campay">Campay</option>
                    </select>
                  </div>
                  <button type="submit" class="btn-primary w-full mt-2 text-xs">Nominate Recipient</button>
                  <p id="nominate-message" class="text-xs text-amber-500"></p>
                </form>
              `;
            } else {
              payoutCardHtml = `
                <p class="text-xs uppercase tracking-widest muted">Next payout</p>
                <p class="mt-2 font-display text-lg font-bold">Awaiting Selection</p>
                <p class="mt-1 text-xs muted">Mode: ${escapeHtml(rotationType)} strategy</p>
                <button id="btn-determine" class="btn-primary mt-4 w-full text-xs">Determine Recipient</button>
                <p id="determine-message" class="text-xs text-amber-500 mt-2"></p>
              `;
            }
          } else {
            // Payout exists. Check status
            const nomineeName = currentPayout.users?.full_name || 'Nominated Recipient';
            const amount = Number(currentPayout.amount).toLocaleString();
            const status = currentPayout.status; // pending, approved, completed, failed

            let statusColor = 'text-amber-500';
            if (status === 'approved') statusColor = 'text-blue-400';
            if (status === 'completed') statusColor = 'text-emerald-400';

            let actionButton = '';
            if (status === 'pending') {
              actionButton = `
                <button id="btn-approve" class="btn-primary mt-4 w-full text-xs" ${eligibility.eligible ? '' : 'disabled'}>
                  Approve payout
                </button>
                ${!eligibility.eligible ? `<p class="text-[10px] text-red-500 mt-1 text-center">Blocked: threshold not met</p>` : ''}
              `;
            } else {
              actionButton = `
                <div class="mt-4 p-2 rounded-lg bg-[var(--bg-muted)] text-center text-xs font-semibold uppercase ${statusColor}">
                  Status: ${escapeHtml(status)}
                </div>
              `;
            }

            payoutCardHtml = `
              <p class="text-xs uppercase tracking-widest muted">Next payout nominee</p>
              <p class="mt-2 font-display text-2xl font-bold truncate">${escapeHtml(nomineeName)}</p>
              <p class="mt-1 text-xs muted">${amount} FCFA · Cycle ${activeCycleNumber}</p>
              
              <div class="mt-3 border-t border-[var(--border-subtle)] pt-3 text-xs space-y-1">
                <div class="flex justify-between"><span>Eligible:</span> <span class="font-bold">${eligibility.eligible ? 'Yes' : 'No'}</span></div>
                <div class="flex justify-between"><span>Collection Rate:</span> <span>${eligibility.collectionRate || 0}%</span></div>
                <div class="flex justify-between"><span>Min Threshold:</span> <span>${eligibility.threshold || 100}%</span></div>
              </div>
              
              ${actionButton}
              <p id="approve-message" class="text-xs text-amber-500 mt-2"></p>
            `;
          }

          // Render last 5 contributions in list
          const contribListHtml = contributions.slice(0, 5).map((entry) => {
            const memberName = entry.users?.full_name || entry.users?.email || 'Member';
            const initials = memberName.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();
            const dateStr = new Date(entry.created_at).toLocaleDateString();
            const chipClass = entry.status === 'confirmed' ? 'paid' : entry.status === 'failed' ? 'failed' : 'due';

            return `
              <li class="flex items-center justify-between py-3">
                <div class="flex items-center gap-3">
                  <div class="h-9 w-9 rounded-full bg-[var(--bg-muted)] text-xs grid place-items-center font-semibold">${escapeHtml(initials)}</div>
                  <div>
                    <p class="text-sm font-medium">${escapeHtml(memberName)}</p>
                    <p class="text-xs muted">${escapeHtml(entry.payment_method || 'pending')} · ${Number(entry.amount).toLocaleString()} FCFA · ${escapeHtml(dateStr)}</p>
                  </div>
                </div>
                <span class="chip chip-${chipClass}">${escapeHtml(entry.status)}</span>
              </li>
            `;
          }).join('') || '<li class="py-6 text-center muted text-sm">No contributions for this cycle yet.</li>';

          // Render rotation schedule
          const rotationListHtml = members.map((member) => {
            const pos = member.rotation_position;
            const name = member.users?.full_name || member.users?.email || 'Member';
            const isMe = member.user_id === currentUser.id;

            let label = '';
            let chipClass = 'due';

            if (pos < activeCycleNumber) {
              label = 'Done';
              chipClass = 'paid';
            } else if (pos === activeCycleNumber) {
              label = 'Next';
              chipClass = 'info';
            }

            const chip = label ? `<span class="chip chip-${chipClass}">${label}</span>` : '—';

            return `
              <li class="flex items-center justify-between text-sm py-2 border-b border-[var(--border-subtle)] last:border-0">
                <span class="${isMe ? 'font-bold accent-text' : ''}">${pos} · ${escapeHtml(name)} ${isMe ? '(You)' : ''}</span>
                <span>${chip}</span>
              </li>
            `;
          }).join('') || '<li class="py-4 text-center muted text-xs">No rotation schedule.</li>';

          const collectionRate = stats.collectionRate || 0;

          mountContent(`
            <div class="glass-card p-4 mb-4 flex flex-wrap items-center gap-3 animate-fade-up">
              <span class="chip chip-info">President</span>
              <p class="text-sm"><span class="muted">Your cycle ${activeCycleNumber} contribution:</span> <span class="font-semibold">${personalStatusText}</span></p>
              <span class="text-sm muted hidden sm:inline">·</span>
              <p class="text-sm"><span class="muted">Your rotation position:</span> <span class="font-semibold">${myPos}</span></p>
              <a href="/app/member/history.html" class="ml-auto nav-link text-xs">My Njangi →</a>
            </div>

            <div class="glass-card p-5 mb-6 flex flex-wrap items-center gap-3">
              <select id="group-picker" class="glass-input w-auto">${groupOptions}</select>
            </div>

            <div class="grid gap-4 md:grid-cols-3 animate-fade-up">
              <div class="glass-card p-5">
                <p class="text-xs uppercase tracking-widest muted">Pot balance</p>
                <p class="mt-2 font-display text-3xl font-bold">${Number(stats.totalCollected || 0).toLocaleString()} FCFA</p>
                <div class="mt-3 h-2 rounded-full bg-[var(--bg-muted)] overflow-hidden">
                  <div class="h-full accent-bg" style="width: ${collectionRate}%"></div>
                </div>
                <p class="mt-2 text-xs muted">${collectionRate}% of cycle target collected</p>
              </div>

              <div id="payout-card" class="glass-card p-5">
                ${payoutCardHtml}
              </div>

              <div class="glass-card p-5">
                <p class="text-xs uppercase tracking-widest muted">Members status</p>
                <p class="mt-2 font-display text-3xl font-bold">${stats.confirmed || 0} / ${stats.totalMembers || 0}</p>
                <p class="mt-1 text-xs muted">active members in cycle ${activeCycleNumber}</p>
              </div>
            </div>

            <div class="mt-6 grid gap-4 lg:grid-cols-3">
              <div class="lg:col-span-2 glass-card p-5">
                <div class="flex items-center justify-between mb-4">
                  <h2 class="font-display text-xl font-bold">Contribution ledger</h2>
                  <span class="chip chip-info">Cycle ${activeCycleNumber}</span>
                </div>
                <ul class="divide-y divide-[var(--border-subtle)]">
                  ${contribListHtml}
                </ul>
              </div>
              <div class="glass-card p-5">
                <h2 class="font-display text-xl font-bold mb-3">Rotation schedule</h2>
                <ol class="space-y-1">
                  ${rotationListHtml}
                </ol>
              </div>
            </div>
          `);

          // Event listeners
          document.querySelector('#group-picker').addEventListener('change', (event) => {
            setStoredGroupId(event.target.value);
            renderPage();
          });

          // Determine Recipient trigger
          const btnDetermine = document.querySelector('#btn-determine');
          if (btnDetermine) {
            btnDetermine.addEventListener('click', async () => {
              const msg = document.querySelector('#determine-message');
              msg.textContent = 'Processing strategy...';
              btnDetermine.disabled = true;
              try {
                await determineNextRecipient(activeGroupId);
                msg.textContent = 'Recipient determined successfully!';
                setTimeout(() => { renderPage(); }, 800);
              } catch (err) {
                btnDetermine.disabled = false;
                msg.textContent = err.message || 'Failed to determine recipient.';
              }
            });
          }

          // Nominate form submit trigger
          const nominateForm = document.querySelector('#nominate-form');
          if (nominateForm) {
            nominateForm.addEventListener('submit', async (event) => {
              event.preventDefault();
              const msg = document.querySelector('#nominate-message');
              msg.textContent = 'Submitting nomination...';
              const formData = new FormData(nominateForm);
              const recipientId = formData.get('recipientId');
              const deliveryMethod = formData.get('deliveryMethod');

              try {
                await nominatePayout(activeGroupId, recipientId, deliveryMethod);
                msg.textContent = 'Nomination recorded!';
                setTimeout(() => { renderPage(); }, 800);
              } catch (err) {
                msg.textContent = err.message || 'Failed to submit nomination.';
              }
            });
          }

          // Approve trigger
          const btnApprove = document.querySelector('#btn-approve');
          if (btnApprove) {
            btnApprove.addEventListener('click', async () => {
              const msg = document.querySelector('#approve-message');
              msg.textContent = 'Submitting approval...';
              btnApprove.disabled = true;
              try {
                await approvePayout(activeGroupId, currentPayout.id);
                msg.textContent = 'Payout approved successfully!';
                setTimeout(() => { renderPage(); }, 800);
              } catch (err) {
                btnApprove.disabled = false;
                msg.textContent = err.message || 'Failed to approve payout.';
              }
            });
          }

        } catch (error) {
          mountContent(`<div class="glass-card p-6"><p class="text-sm text-red-500">${escapeHtml(error.message || 'Failed to load group overview.')}</p></div>`);
        }
      };

      renderPage();
    </script>
  </body>
</html>
