<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Members — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>
    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import { session } from '/src/js/auth/session.js';
      import {
        resolveGroupContext,
        setStoredGroupId,
        listMembers,
        inviteMember,
        updateMemberRole,
        removeMember,
        groupLabel
      } from '/src/js/api/njangi.js';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      renderShell({ role: 'president', title: 'Member management' });

      const renderPage = async () => {
        mountContent(`<div class="glass-card p-6">Loading members…</div>`);

        try {
          const { groups, activeGroupId, activeGroup } = await resolveGroupContext();
          if (!activeGroupId) {
            mountContent(`
              <div class="glass-card p-6">
                <p class="font-semibold">No group selected</p>
                <p class="mt-2 text-sm muted">Choose or create a group first.</p>
              </div>
            `);
            return;
          }

          const members = await listMembers(activeGroupId);
          const currentUser = session.user() || {};

          // Group picker options
          const groupOptions = groups.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === activeGroupId ? 'selected' : ''}>${escapeHtml(groupLabel(group))}</option>`).join('');

          const rows = members.map(m => {
            const userId = m.users?.id || m.user_id;
            const name = m.users?.full_name || m.users?.email || 'Member';
            const phone = m.users?.phone || m.phone || '—';
            const role = m.role || 'member';
            const status = m.status || 'active';
            const initials = name.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();

            const isSelf = userId === currentUser.id;
            const disabledAttr = isSelf ? 'disabled' : '';

            return `
              <tr data-user-id="${escapeHtml(userId)}">
                <td class="px-5 py-3">
                  <div class="flex items-center gap-3">
                    <div class="h-8 w-8 rounded-full accent-bg text-white grid place-items-center text-xs font-semibold">${escapeHtml(initials)}</div>
                    <span class="font-medium">${escapeHtml(name)} ${isSelf ? '(You)' : ''}</span>
                  </div>
                </td>
                <td>
                  <select class="glass-input w-auto py-1 text-xs role-select" ${disabledAttr}>
                    <option value="president" ${role === 'president' ? 'selected' : ''}>President</option>
                    <option value="treasurer" ${role === 'treasurer' ? 'selected' : ''}>Treasurer</option>
                    <option value="secretary" ${role === 'secretary' ? 'selected' : ''}>Secretary</option>
                    <option value="member" ${role === 'member' ? 'selected' : ''}>Member</option>
                  </select>
                </td>
                <td class="font-mono text-xs">${escapeHtml(phone)}</td>
                <td><span class="chip chip-${status === 'active' ? 'paid' : 'failed'}">${escapeHtml(status)}</span></td>
                <td class="text-right pr-5">
                  <button class="nav-link text-xs btn-remove text-red-500" ${disabledAttr}>Remove</button>
                </td>
              </tr>
            `;
          }).join('');

          mountContent(`
            <div class="glass-card p-5 mb-6 flex flex-wrap items-center gap-3 animate-fade-up">
              <select id="group-picker" class="glass-input w-auto">${groupOptions}</select>
              <div class="flex-1"></div>
              <button id="btn-invite" class="btn-primary">+ Invite member</button>
            </div>

            <!-- Invite Modal -->
            <div id="invite-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
              <div class="glass-card max-w-md w-full p-6 space-y-4 animate-fade-up">
                <h3 class="font-display text-lg font-bold">Invite New Member</h3>
                <p class="text-xs muted">Enter the member's registered phone number to send an invitation token.</p>
                <form id="invite-form" class="space-y-3">
                  <div>
                    <label class="text-[10px] uppercase tracking-wider muted font-semibold">Phone Number</label>
                    <input type="text" name="phone" placeholder="+237677000002" required class="glass-input mt-1" />
                  </div>
                  <div class="flex justify-end gap-2 pt-2">
                    <button type="button" id="btn-invite-cancel" class="nav-link text-xs py-2 px-4 rounded-lg bg-[var(--bg-muted)]">Cancel</button>
                    <button type="submit" class="btn-primary text-xs py-2 px-4">Send Invite</button>
                  </div>
                  <p id="invite-message" class="text-xs text-amber-500"></p>
                </form>
              </div>
            </div>

            <div class="glass-card p-0 overflow-hidden animate-fade-up">
              <table class="w-full text-sm">
                <thead class="text-left muted uppercase text-xs bg-[var(--bg-muted)]">
                  <tr>
                    <th class="px-5 py-3">Name</th>
                    <th>Role</th>
                    <th>Phone (MoMo)</th>
                    <th>Status</th>
                    <th class="text-right pr-5">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border-subtle)]">${rows || '<tr><td colspan="5" class="px-5 py-8 text-center muted">No members found.</td></tr>'}</tbody>
              </table>
            </div>

            <p class="mt-4 text-xs muted">PR-06: assign Treasurer/Secretary · PR-07: remove member (audit-logged).</p>
          `);

          // Event Listeners
          document.querySelector('#group-picker').addEventListener('change', (event) => {
            setStoredGroupId(event.target.value);
            renderPage();
          });

          // Invite Modal triggers
          const inviteModal = document.querySelector('#invite-modal');
          const btnInvite = document.querySelector('#btn-invite');
          const btnInviteCancel = document.querySelector('#btn-invite-cancel');
          const inviteForm = document.querySelector('#invite-form');
          const inviteMsg = document.querySelector('#invite-message');

          btnInvite.addEventListener('click', () => {
            inviteModal.classList.remove('hidden');
            inviteForm.reset();
            inviteMsg.textContent = '';
          });

          btnInviteCancel.addEventListener('click', () => {
            inviteModal.classList.add('hidden');
          });

          inviteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            inviteMsg.textContent = 'Sending invitation...';
            const formData = new FormData(inviteForm);
            const phone = formData.get('phone').trim();

            try {
              await inviteMember(activeGroupId, phone);
              inviteMsg.textContent = 'Invitation sent successfully!';
              setTimeout(() => {
                inviteModal.classList.add('hidden');
                renderPage();
              }, 1200);
            } catch (err) {
              inviteMsg.textContent = err.message || 'Failed to send invitation.';
            }
          });

          // Role selection changes
          document.querySelectorAll('.role-select').forEach(select => {
            select.addEventListener('change', async (e) => {
              const row = e.target.closest('tr');
              const userId = row.dataset.userId;
              const newRole = e.target.value;
              
              try {
                await updateMemberRole(activeGroupId, userId, newRole);
                alert(`Role updated to ${newRole} successfully.`);
                renderPage();
              } catch (err) {
                alert(err.message || 'Failed to update role.');
                renderPage();
              }
            });
          });

          // Member removal trigger
          document.querySelectorAll('.btn-remove').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const row = e.target.closest('tr');
              const userId = row.dataset.userId;
              const name = row.querySelector('.font-medium').textContent.trim();

              if (!confirm(`Are you sure you want to remove ${name} from this Njangi? This action is permanent and audit-logged.`)) {
                return;
              }

              try {
                await removeMember(activeGroupId, userId);
                alert(`${name} removed successfully.`);
                renderPage();
              } catch (err) {
                alert(err.message || 'Failed to remove member.');
              }
            });
          });

        } catch (error) {
          mountContent(`<div class="glass-card p-6"><p class="text-sm text-red-500">${escapeHtml(error.message || 'Failed to load members.')}</p></div>`);
        }
      };

      renderPage();
    </script>
  </body>
</html>
