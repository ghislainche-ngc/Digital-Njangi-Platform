<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Payouts — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>
    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import {
        approvePayout,
        determineNextRecipient,
        executePayout,
        getCurrentPayout,
        listPayouts,
        resolveGroupContext,
        setStoredGroupId,
      } from '/src/js/api/njangi.js';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      renderShell({ role: 'treasurer', title: 'Payouts' });
      const renderPage = async () => {
        mountContent(`<div class="glass-card p-6">Loading payouts…</div>`);

        try {
          const { groups, activeGroupId, activeGroup } = await resolveGroupContext();
          if (!activeGroupId) {
            mountContent(`
              <div class="glass-card p-6">
                <p class="font-semibold">No group selected</p>
                <p class="mt-2 text-sm muted">Choose a group from the groups page first.</p>
              </div>
            `);
            return;
          }

          const [currentResponse, historyResponse] = await Promise.all([
            getCurrentPayout(activeGroupId),
            listPayouts(activeGroupId),
          ]);

          const current = currentResponse.data || currentResponse;
          const history = historyResponse.data || historyResponse;
          const payout = current.payout || {};
          const eligibility = current.eligibility || {};
          const cycle = current.cycle || {};

          const groupOptions = groups.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === activeGroupId ? 'selected' : ''}>${escapeHtml(group.name)}</option>`).join('');
          const historyRows = history.length
            ? history.map((entry) => `
                <li class="flex items-center justify-between py-3 border-b border-subtle last:border-0">
                  <div>
                    <p class="font-medium">${escapeHtml(entry.users?.full_name || 'Recipient')}</p>
                    <p class="text-xs muted">Cycle ${escapeHtml(entry.cycles?.cycle_number || '—')} · ${escapeHtml(entry.status)}</p>
                  </div>
                  <span class="font-mono">${Number(entry.amount || 0).toLocaleString()}</span>
                </li>
              `).join('')
            : '<li class="py-4 text-sm muted">No payouts yet.</li>';

          mountContent(`
            <div class="grid gap-6 lg:grid-cols-3">
              <div class="lg:col-span-2 glass-card p-6">
                <div class="flex items-center justify-between mb-5 gap-3 flex-wrap">
                  <div>
                    <p class="text-xs uppercase tracking-widest muted">Current group</p>
                    <h2 class="font-display text-xl font-bold mt-1">${escapeHtml(activeGroup?.name || 'Selected group')}</h2>
                  </div>
                  <select id="group-picker" class="glass-input w-auto">${groupOptions}</select>
                </div>

                <div class="flex items-center gap-4 p-4 rounded-xl bg-[var(--bg-muted)]">
                  <div class="h-14 w-14 rounded-full accent-bg text-[var(--text-on-brand)] grid place-items-center font-bold">${escapeHtml((payout.users?.full_name || '??').slice(0, 2).toUpperCase())}</div>
                  <div class="flex-1">
                    <p class="font-display text-2xl font-bold">${escapeHtml(payout.users?.full_name || 'No payout yet')}</p>
                    <p class="text-sm muted">${escapeHtml(payout.users?.phone || 'Awaiting recipient')}
                      ${cycle.number ? ` · Cycle ${escapeHtml(cycle.number)}` : ''}
                    </p>
                  </div>
                  <div class="text-right">
                    <p class="font-display text-2xl font-bold">${Number(payout.amount || 0).toLocaleString()}</p>
                    <p class="text-xs muted">${escapeHtml(payout.delivery_method || 'pending')}</p>
                  </div>
                </div>

                <h3 class="font-semibold mt-6 mb-3 text-sm">Eligibility</h3>
                <ul class="space-y-2 text-sm">
                  <li class="flex items-center gap-2"><span class="chip ${eligibility.eligible ? 'chip-paid' : 'chip-due'}">${eligibility.eligible ? '✓' : '!'}</span> ${escapeHtml(eligibility.reason || 'Eligibility checked')}</li>
                  <li class="flex items-center gap-2"><span class="chip chip-paid">✓</span> Collection rate ${Number(eligibility.collectionRate || 0)}%</li>
                  <li class="flex items-center gap-2"><span class="chip chip-paid">✓</span> Threshold ${eligibility.threshold || 'configured'}</li>
                </ul>

                <div class="mt-6 flex gap-3 flex-wrap">
                  <button id="determine-button" class="btn-ghost flex-1 min-w-40">Determine next recipient</button>
                  <button id="approve-button" class="btn-ghost flex-1 min-w-40" ${payout.id && payout.status === 'pending' ? '' : 'disabled'}>Approve payout</button>
                  <select id="delivery-method" class="glass-input w-auto">
                    <option value="momo_mtn">MTN MoMo</option>
                    <option value="momo_orange">Orange Money</option>
                    <option value="campay">Campay</option>
                    <option value="cash">Cash</option>
                    <option value="bank">Bank transfer</option>
                  </select>
                  <button id="execute-button" class="btn-primary flex-1 min-w-40" ${payout.id && payout.status === 'approved' ? '' : 'disabled'}>Trigger payout</button>
                </div>
                <p id="payout-message" class="mt-3 text-xs muted"></p>
              </div>

              <div class="glass-card p-6">
                <h2 class="font-display text-xl font-bold mb-4">History</h2>
                <ol class="space-y-1 text-sm">${historyRows}</ol>
              </div>
            </div>
          `);

          document.querySelector('#group-picker').addEventListener('change', (event) => {
            setStoredGroupId(event.target.value);
            renderPage();
          });

          const message = document.querySelector('#payout-message');

          document.querySelector('#determine-button').addEventListener('click', async () => {
            message.textContent = 'Determining recipient…';
            try {
              await determineNextRecipient(activeGroupId);
              renderPage();
            } catch (error) {
              message.textContent = error.message || 'Could not determine recipient.';
            }
          });

          document.querySelector('#approve-button').addEventListener('click', async () => {
            if (!payout.id) return;
            message.textContent = 'Approving payout…';
            try {
              await approvePayout(activeGroupId, payout.id);
              renderPage();
            } catch (error) {
              message.textContent = error.message || 'Approval failed.';
            }
          });

          document.querySelector('#execute-button').addEventListener('click', async () => {
            if (!payout.id) return;
            message.textContent = 'Executing payout…';
            try {
              const deliveryMethod = document.querySelector('#delivery-method').value;
              await executePayout(activeGroupId, payout.id, deliveryMethod);
              renderPage();
            } catch (error) {
              message.textContent = error.message || 'Execution failed.';
            }
          });
        } catch (error) {
          mountContent(`<div class="glass-card p-6"><p class="text-sm text-red-500">${escapeHtml(error.message || 'Failed to load payouts.')}</p></div>`);
        }
      };

      renderPage();
    </script>
  </body>
</html>
