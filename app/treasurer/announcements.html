<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Announcements — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-data x-init="$store.theme.init()" x-cloak class="relative">
    <div id="app-shell"></div>
    <script type="module">
      import { renderShell, mountContent } from '/src/js/components/app-shell.js';
      import {
        resolveGroupContext,
        setStoredGroupId,
        groupLabel,
        listAnnouncements,
        createAnnouncement,
        deleteAnnouncement
      } from '/src/js/api/njangi.js';

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      renderShell({ role: 'treasurer', title: 'Announcements' });

      let activeGroupId = '';
      let announcements = [];

      function timeAgo(dateString) {
        const date = new Date(dateString);
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return 'Just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        if (days < 7) return `${days} days ago`;
        const weeks = Math.floor(days / 7);
        if (weeks < 4) return `${weeks} weeks ago`;
        return date.toLocaleDateString();
      }

      const renderFeed = () => {
        const container = document.querySelector('#feed-container');
        if (!container) return;

        container.innerHTML = announcements.map(a => {
          const relativeTime = timeAgo(a.created_at);
          return `
            <div class="glass-card p-5 relative" data-id="${escapeHtml(a.id)}">
              <button class="btn-delete absolute top-4 right-4 text-xs text-red-500 nav-link p-1">Delete</button>
              <div class="flex items-start justify-between gap-3 mb-2 pr-12">
                <p class="font-semibold">${escapeHtml(a.title)}</p>
                <span class="chip chip-info text-xs shrink-0">${escapeHtml(relativeTime)}</span>
              </div>
              <p class="text-sm muted">${escapeHtml(a.body)}</p>
              <p class="text-xs muted mt-3">via ${escapeHtml(a.channel)}</p>
            </div>
          `;
        }).join('') || '<div class="glass-card p-5 text-center muted">No announcements posted yet.</div>';

        // Wire delete buttons
        container.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const card = e.target.closest('[data-id]');
            const id = card.dataset.id;
            if (confirm('Are you sure you want to delete this announcement?')) {
              try {
                await deleteAnnouncement(activeGroupId, id);
                renderPage();
              } catch (err) {
                alert(err.message || 'Failed to delete announcement.');
              }
            }
          });
        });
      };

      const renderPage = async () => {
        mountContent(`<div class="glass-card p-6">Loading announcements…</div>`);

        try {
          const { groups, activeGroupId: id } = await resolveGroupContext();
          activeGroupId = id;
          if (!activeGroupId) {
            mountContent(`
              <div class="glass-card p-6">
                <p class="font-semibold">No group selected</p>
                <p class="mt-2 text-sm muted">Choose or create a group first.</p>
              </div>
            `);
            return;
          }

          const list = await listAnnouncements(activeGroupId);
          announcements = Array.isArray(list) ? list : (list?.data || []);

          // Group picker options
          const groupOptions = groups.map((group) => `<option value="${escapeHtml(group.id)}" ${group.id === activeGroupId ? 'selected' : ''}>${escapeHtml(groupLabel(group))}</option>`).join('');

          mountContent(`
            <div class="glass-card p-5 mb-6 flex flex-wrap items-center gap-3">
              <select id="group-picker" class="glass-input w-auto">${groupOptions}</select>
            </div>

            <div class="grid gap-6 lg:grid-cols-3">
              <div id="feed-container" class="lg:col-span-2 space-y-4"></div>

              <div class="glass-card p-6 h-fit sticky top-24">
                <h2 class="font-display text-xl font-bold mb-4">New announcement</h2>
                <form id="announcement-form" class="space-y-4">
                  <div>
                    <label class="text-xs font-semibold uppercase tracking-wider muted">Title</label>
                    <input name="title" required class="glass-input mt-1" placeholder="e.g. Venue change" />
                  </div>
                  <div>
                    <label class="text-xs font-semibold uppercase tracking-wider muted">Message</label>
                    <textarea name="body" required class="glass-input mt-1 min-h-[120px]" placeholder="Keep it short — Telegram/SMS friendly."></textarea>
                  </div>
                  <div>
                    <label class="text-xs font-semibold uppercase tracking-wider muted">Channels</label>
                    <div class="mt-2 space-y-2">
                      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="channel" value="Telegram" checked class="accent-[var(--accent)]"/> Telegram</label>
                      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="channel" value="SMS" class="accent-[var(--accent)]"/> SMS fallback</label>
                      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="channel" value="In-App" class="accent-[var(--accent)]"/> In-app only</label>
                    </div>
                  </div>
                  <button type="submit" class="btn-primary w-full">Publish</button>
                </form>
              </div>
            </div>

            <p class="mt-4 text-xs muted">PR-10: Announcements posted.</p>
          `);

          renderFeed();

          // Group picker change
          document.querySelector('#group-picker').addEventListener('change', (event) => {
            setStoredGroupId(event.target.value);
            renderPage();
          });

          // Handle form submit
          document.querySelector('#announcement-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Publishing...';

            const formData = new FormData(e.target);
            const title = formData.get('title').trim();
            const body = formData.get('body').trim();
            const channels = formData.getAll('channel');

            try {
              await createAnnouncement(activeGroupId, {
                title,
                body,
                channels
              });
              e.target.reset();
              renderPage();
            } catch (err) {
              alert(err.message || 'Failed to publish announcement.');
              btn.disabled = false;
              btn.textContent = 'Publish';
            }
          });

        } catch (error) {
          mountContent(`<div class="glass-card p-6"><p class="text-sm text-red-500">${escapeHtml(error.message || 'Failed to load announcements.')}</p></div>`);
        }
      };

      renderPage();
    </script>
  </body>
</html>
