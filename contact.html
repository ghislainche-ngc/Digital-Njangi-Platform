<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Contact — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body x-init="$store.theme.init()" class="min-h-screen relative">
    <header class="mx-auto max-w-7xl px-6 py-5 flex items-center">
      <a href="/" class="flex items-center gap-2 font-display font-extrabold text-lg">
        <img src="/logo.png" alt="NjangiBridge" class="h-9 w-9 rounded-xl object-contain bg-white p-1" />
        <span x-text="$t('brand.name')"></span>
      </a>
      <div class="ml-auto flex items-center gap-2">
        <button @click="$store.theme.toggle()" class="nav-link">Toggle theme</button>
      </div>
    </header>

    <main class="relative z-10 mx-auto max-w-3xl px-6 py-12">
      <div class="glass-card-heavy p-8 animate-fade-up">
        <h1 class="font-display text-3xl font-bold">Get in touch</h1>
        <p class="mt-4 text-sm text-secondary-app">For general enquiries, partnerships or support, email us at <a href="mailto:hello@naas.app" class="accent-text">hello@naas.app</a>.</p>

        <form class="mt-6 space-y-4" action="mailto:hello@naas.app" method="POST" enctype="text/plain">
          <div>
            <label class="text-xs font-semibold uppercase tracking-wider muted">Name</label>
            <input type="text" name="name" class="glass-input mt-1" required />
          </div>
          <div>
            <label class="text-xs font-semibold uppercase tracking-wider muted">Email</label>
            <input type="email" name="email" class="glass-input mt-1" required />
          </div>
          <div>
            <label class="text-xs font-semibold uppercase tracking-wider muted">Message</label>
            <textarea name="message" class="glass-input mt-1 h-28" required></textarea>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="btn-primary">Send</button>
          </div>
        </form>

      </div>
    </main>
  </body>
</html>
