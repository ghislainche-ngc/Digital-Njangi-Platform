<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Register a Njangi — NjangiBridge</title>
    <link rel="stylesheet" href="/src/css/app.css" />
    <!-- Define registerPage BEFORE boot.js calls Alpine.start() -->
    <script type="module">
      import { api } from '/src/js/api/client.js';
      window.registerPage = () => ({
        form: {
          email: '',
          phone: new URLSearchParams(window.location.search).get('phone') || '',
          full_name: '',
          password: '',
          language: 'en',
        },
        loading: false,
        error: '',
        success: '',
        async submit() {
          this.error = '';
          this.loading = true;
          try {
            const response = await api.post('/auth/register', this.form);
            this.success = response.message || 'Registration successful. Check your phone for the OTP code.';
            if (response.otpCode) {
              this.success += ` Dev OTP: ${response.otpCode}`;
            }
            this.form.password = '';
          } catch (err) {
            this.error = err.message || 'Registration failed';
          } finally {
            this.loading = false;
          }
        },
      });
    </script>
    <script type="module" src="/src/js/boot.js"></script>
  </head>
  <body
    x-data="registerPage()" x-init="$store.theme.init()" x-cloak
    class="min-h-screen relative"
  >
    <header class="mx-auto max-w-7xl px-6 py-5 flex items-center">
      <a href="/" class="flex items-center select-none font-display font-black text-2xl tracking-[-0.07em]">
        <span class="text-[#e53238]">N</span><span class="text-[#0064d2]">j</span><span class="text-[#f5af02]">a</span><span class="text-[#86b817]">n</span><span class="text-[#e53238]">g</span><span class="text-[#0064d2]">i</span><span class="text-black dark:text-white ml-0.5">Bridge</span>
      </a>
      <div class="ml-auto flex items-center gap-2">
        <div x-data="{ open: false }" class="relative">
          <button @click="open = !open" @click.outside="open = false" class="nav-link">
            <span class="uppercase text-xs font-semibold" x-text="$store.i18n.locale"></span>
          </button>
          <div x-show="open" x-transition class="glass-card absolute right-0 mt-2 w-28 p-1">
            <template x-for="l in $store.i18n.locales()" :key="l">
              <button
                @click="$store.i18n.setLocale(l); open = false"
                class="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-[var(--bg-muted)]"
                :class="$store.i18n.locale === l ? 'accent-text font-semibold' : ''"
                x-text="l.toUpperCase()"
              ></button>
            </template>
          </div>
        </div>
        <button @click="$store.theme.toggle()" class="nav-link">
          <svg x-show="$store.theme.effective === 'light'" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg x-show="$store.theme.effective === 'dark'"  class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="relative z-10 mx-auto max-w-2xl px-6 py-10">
      <div class="glass-card-heavy p-8 animate-fade-up">
        <h1 class="font-display text-3xl font-bold" x-text="$t('register.user_title')"></h1>
        <p class="mt-2 text-sm text-secondary-app" x-text="$t('register.user_subtitle')"></p>

        <form @submit.prevent="submit" class="mt-6 space-y-5">
          <div>
            <label class="text-xs font-semibold uppercase tracking-wider muted">Full name</label>
            <input x-model="form.full_name" required type="text" class="glass-input mt-1" placeholder="Aline Mboh" />
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-semibold uppercase tracking-wider muted">Email</label>
              <input x-model="form.email" required type="email" class="glass-input mt-1" placeholder="you@example.com" />
            </div>
            <div>
              <label class="text-xs font-semibold uppercase tracking-wider muted">Phone</label>
              <input x-model="form.phone" required type="tel" class="glass-input mt-1" placeholder="+237677000001" />
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="text-xs font-semibold uppercase tracking-wider muted">Password</label>
              <input x-model="form.password" required type="password" minlength="8" class="glass-input mt-1" placeholder="••••••••" />
            </div>
            <div>
              <label class="text-xs font-semibold uppercase tracking-wider muted">Language</label>
              <select x-model="form.language" class="glass-input mt-1">
                <option value="en">English</option>
                <option value="fr">Français</option>
              </select>
            </div>
          </div>

          <template x-if="error">
            <p class="text-sm text-red-500" x-text="error"></p>
          </template>

          <template x-if="success">
            <p class="text-sm text-emerald-500" x-text="success"></p>
          </template>

          <div class="pt-2">
            <button
              type="submit" class="btn-primary w-full"
              :disabled="loading"
              :class="loading ? 'opacity-60 cursor-not-allowed' : ''"
            >
              <span x-show="!loading" x-text="$t('register.user_submit')"></span>
              <span x-show="loading" x-text="$t('common.loading')"></span>
            </button>
          </div>
        </form>

        <p class="mt-6 text-sm text-center muted">
          <span x-text="$t('register.have_account')"></span>
          <a :href="new URLSearchParams(window.location.search).get('token') ? `/login.html?token=${new URLSearchParams(window.location.search).get('token')}` : '/login.html'" class="accent-text font-semibold ml-1" x-text="$t('register.sign_in')"></a>
        </p>
      </div>
    </main>

  </body>
</html>
