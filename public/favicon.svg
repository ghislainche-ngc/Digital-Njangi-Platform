<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- Bridge arch -->
  <path d="M10 44 Q32 4 54 44" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Bridge deck -->
  <line x1="6" y1="44" x2="58" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Left pier -->
  <line x1="10" y1="44" x2="10" y2="56" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Right pier -->
  <line x1="54" y1="44" x2="54" y2="56" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Keystone at arch crown -->
  <circle cx="32" cy="24" r="4" fill="#ffffff"/>
  <!-- Center support -->
  <line x1="32" y1="28" x2="32" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
