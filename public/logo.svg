<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Arch bridge — symbol of connection, community, and trust -->
  <!-- Main arch curve -->
  <path d="M20 78 Q60 8 100 78" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round"/>
  <!-- Bridge deck -->
  <line x1="14" y1="78" x2="106" y2="78" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  <!-- Left pier -->
  <line x1="20" y1="78" x2="20" y2="104" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  <!-- Right pier -->
  <line x1="100" y1="78" x2="100" y2="104" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  <!-- Keystone — the community cornerstone at the arch crown -->
  <circle cx="60" cy="43" r="7" fill="#0a0a0a"/>
  <!-- Center support from keystone to deck -->
  <line x1="60" y1="50" x2="60" y2="78" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
</svg>
